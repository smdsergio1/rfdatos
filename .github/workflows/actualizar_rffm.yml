name: Actualizar datos RFFM semanalmente

on:
  schedule:
    # Se ejecuta todos los lunes a las 04:00 UTC (05:00 o 06:00 hora peninsular española)
    - cron: '0 4 * * 1'
  # Permite lanzarlo manualmente con un botón cuando quieras probarlo
  workflow_dispatch:

permissions:
  contents: write  # Necesario para que el robot pueda guardar los archivos actualizados en el repo

jobs:
  extraer-y-guardar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script de extracción RFFM
        run: python extraer_rffm.py

      - name: Guardar cambios si los datos han cambiado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rffm_f11_icj.json rffm_f11_icj.csv
          git diff --staged --quiet || (git commit -m "Actualización automática datos RFFM" && git push)
